name: Sync Wedding Couples

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2:00 AM UTC

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate couple JSON files and photo folders
        run: node .github/scripts/generate-couple.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/wedding-data_*.json public/photos/
          git diff --staged --quiet && echo "No changes to commit." || (
            git commit -m "chore: sync couple wedding data" &&
            git push origin HEAD
          )
